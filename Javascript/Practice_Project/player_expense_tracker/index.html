<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Expense Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Expense Tracker</h1>
      <form id="player-form">
        <input
          type="text"
          id="player-name"
          placeholder="player name"
          required
        />
        <input
          type="number"
          id="monthly-amount"
          placeholder="Amount"
          required
        />
        <button type="submit">Add Expense</button>
      </form>

      <h2>Expenses</h2>
      <ul id="expense-list">
        
      </ul>

      <div id="total">
        <h3>Total: $<span id="total-amount">0.00</span></h3>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
